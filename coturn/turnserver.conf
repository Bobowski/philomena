# Philomena's TURN server (coturn 4.18.0). Plain TURN on 3478 UDP+TCP.
# No TLS/DTLS: Caddy cannot proxy TURN UDP anyway, and WebRTC media is
# end-to-end DTLS-SRTP, so the relay only ever sees ciphertext.
listening-port=3478
no-tls

# The UDP relay endpoints the browser talks to from the public side.
min-port=49160
max-port=49199

# TURN REST credentials: the app signs <expiry>:<random> usernames with
# COTURN_STATIC_AUTH_SECRET (passed on the command line, not here).
use-auth-secret
# The realm is a label in the TURN handshake, not a host name.
realm=philomena
stale-nonce=600

# Cheap hardening and size limits.
fingerprint
no-tcp-relay
no-multicast-peers
no-software-attribute
user-quota=12
total-quota=120
max-bps=625000

# Logs go to stdout so `podman logs` sees them.
log-file=stdout
simple-log

# Never relay toward private or special-use addresses: a leaked TURN
# credential must not reach Yard's containers or the host's own networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::-::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=100::-100:0:0:0:ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
